<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Compras - Sankhya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-lg">
    
    <!-- Botões Superiores (Ações do Usuário) -->
    <div class="flex justify-end gap-3 mb-6">
      <button 
        onclick="cadastrarFaceID()" 
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 color-white text-white text-sm font-semibold rounded-lg shadow-sm transition-colors flex items-center gap-2">
        👤 Cadastrar Face ID neste iPhone/PC
      </button>
      <a 
        href="/logout" 
        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors flex items-center justify-center">
        Sair
      </a>
    </div>

    <!-- Header e Busca -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Sugestão de Compras</h1>
        <p class="text-sm text-gray-500">Integrado ao ERP Sankhya</p>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Buscar por código ou descrição..." 
        class="border border-gray-300 rounded-lg px-4 py-2 w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <!-- Tabela de Produtos -->
    <div class="overflow-x-auto rounded-lg border border-gray-200">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-800 text-white uppercase text-xs tracking-wider">
            <th class="p-3">Código</th>
            <th class="p-3">Descrição do Produto</th>
            <th class="p-3">Unid.</th>
            <th class="p-3 text-right">Estoque Atual</th>
            <th class="p-3 text-right">Estoque Mín.</th>
            <th class="p-3 text-right">Sugestão Compra</th>
            <th class="p-3 text-center">Status</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-200 text-sm">
          <tr>
            <td colspan="7" class="p-6 text-center text-gray-500">
              Carregando dados do Sankhya...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let todosProdutos = [];

    // Tenta carregar pela rota do Sankhya ou fallback para a rota unificada de estoque
    async function carregarProdutos() {
      const tbody = document.getElementById('tableBody');
      try {
        // Chamada relativa ao mesmo domínio onde a aplicação está rodando (Render)
        let response = await fetch('/api/sankhya');
        
        if (!response.ok) {
          response = await fetch('/api/estoque');
        }

        const data = await response.json();
        const listaProdutos = data.produtos || (Array.isArray(data) ? data : []);

        if ((data.sucesso || response.ok) && Array.isArray(listaProdutos)) {
          todosProdutos = listaProdutos;
          renderizarTabela(todosProdutos);
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 font-semibold">Erro ao carregar produtos. Verifique a API.</td></tr>`;
        }
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 font-semibold">Falha na conexão com o servidor de dados.</td></tr>`;
      }
    }

    function renderizarTabela(produtos) {
      const tbody = document.getElementById('tableBody');

      if (produtos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">Nenhum produto encontrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = produtos.map(p => {
        const codigo = p.codigo || p.codprod || '-';
        const descricao = p.descricao || p.produto || '-';
        const unidade = p.unidade || p.UNIDADE || 'UN';
        const estoque = Number(p.estoque ?? p.estoque_disponivel ?? 0);
        const estoqueMin = Number(p.estoque_minimo ?? p.estoque_meta ?? 0);
        const sugestao = Number(p.sugestao_compra ?? 0);

        const precisaComprar = sugestao > 0 || (p.status && String(p.status).toLowerCase().includes('comprar'));
        const badgeStatus = precisaComprar
          ? `<span class="bg-red-100 text-red-800 font-bold px-3 py-1 rounded-full text-xs">REPOR</span>`
          : `<span class="bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full text-xs">OK</span>`;

        return `
          <tr class="hover:bg-blue-50 transition-colors ${precisaComprar ? 'bg-red-50/40' : ''}">
            <td class="p-3 font-mono text-gray-600">${codigo}</td>
            <td class="p-3 font-medium text-gray-900">${descricao}</td>
            <td class="p-3 text-gray-500">${unidade}</td>
            <td class="p-3 text-right font-semibold text-gray-800">${estoque.toLocaleString('pt-BR')}</td>
            <td class="p-3 text-right text-gray-500">${estoqueMin.toLocaleString('pt-BR')}</td>
            <td class="p-3 text-right font-bold ${precisaComprar ? 'text-red-600' : 'text-gray-700'}">
              ${sugestao.toLocaleString('pt-BR')}
            </td>
            <td class="p-3 text-center">${badgeStatus}</td>
          </tr>
        `;
      }).join('');
    }

    // Filtro de Busca em Tempo Real
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase();
      const filtrados = todosProdutos.filter(p => {
        const desc = String(p.descricao || p.produto || '').toLowerCase();
        const cod = String(p.codigo || p.codprod || '').toLowerCase();
        return desc.includes(termo) || cod.includes(termo);
      });
      renderizarTabela(filtrados);
    });

    // Função de Autenticação WebAuthn (Face ID)
    async function cadastrarFaceID() {
      try {
        const resOptions = await fetch("/api/webauthn/register-options");
        const options = await resOptions.json();

        options.challenge = Uint8Array.from(atob(options.challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
        options.user.id = Uint8Array.from(atob(options.user.id.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

        const credential = await navigator.credentials.create({ publicKey: options });

        const regData = {
          id: credential.id,
          rawId: arrayBufferToBase64(credential.rawId),
          type: credential.type,
          response: {
            attestationObject: arrayBufferToBase64(credential.response.attestationObject),
            clientDataJSON: arrayBufferToBase64(credential.response.clientDataJSON)
          }
        };

        const verifyRes = await fetch("/api/webauthn/register-verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(regData)
        });

        const data = await verifyRes.json();
        alert(data.message || "Cadastro realizado com sucesso!");
      } catch (err) {
        alert("Erro ou cancelamento do cadastro de Face ID.");
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      let bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    // Inicializa a busca dos dados ao carregar
    carregarProdutos();
  </script>
</body>
</html>
