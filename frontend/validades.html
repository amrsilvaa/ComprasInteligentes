<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta de Validades e Análise de Estoque</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            color: #334155;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 24px; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); 
        }
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
        }
        .header-bar h1 {
            font-size: 24px;
            color: #0f172a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .actions-bar { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        .search-input, .select-filter { 
            padding: 10px 14px; 
            font-size: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus, .select-filter:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .search-input { flex: 2; min-width: 280px; }
        .select-filter { flex: 1; min-width: 220px; background-color: #fff; cursor: pointer; }
        
        .btn { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-success:hover { background-color: #15803d; }
        
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-top: 10px; 
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        th, td { 
            border-bottom: 1px solid #e2e8f0; 
            padding: 12px 14px; 
            text-align: left; 
            vertical-align: middle; 
            font-size: 14px; 
        }
        th { 
            background-color: #f8fafc; 
            font-weight: 700; 
            color: #475569;
            border-bottom: 2px solid #cbd5e1;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .lote-row { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 6px; 
            align-items: center; 
        }
        .input-qtd { width: 90px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .input-val { width: 140px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        
        .btn-add { background-color: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background-color: #1d4ed8; }
        .btn-remove { background-color: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-remove:hover { background-color: #dc2626; }
        
        .badge-estoque { 
            background-color: #f1f5f9; 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-weight: 700; 
            color: #0f172a;
            display: inline-block;
        }
        .badge-destaque {
            background-color: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>📅 Coleta de Validades & Análise de Estoque</h1>
        </div>

        <div class="actions-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por Código, EAN, Complemento ou Descrição..." onkeyup="filtrarTabela()">
            
            <select id="selectSeparador" class="select-filter" onchange="filtrarTabela()">
                <option value="">-- Todos os Separadores --</option>
            </select>

            <button class="btn btn-success" onclick="exportarExcel()">📊 Exportar para Excel</button>
        </div>

        <table id="tabelaValidades">
            <thead>
                <tr>
                    <th style="width: 80px;">Código</th>
                    <th style="width: 130px;">EAN</th>
                    <th style="width: 120px;">Complemento</th>
                    <th>Descrição</th>
                    <th style="width: 140px;">Separador</th>
                    <th style="width: 110px;">Estoque Atual</th>
                    <th style="width: 320px;">Lotes / Coletas (Qtd e Data Validade)</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 20px; color: #64748b;">Carregando dados...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let todosProdutos = [];

        async function carregarDados() {
            try {
                const response = await fetch('/api/validades');
                if (!response.ok) throw new Error('Falha ao obter dados da API');
                
                const resultado = await response.json();
                todosProdutos = resultado.data || resultado;

                popularSelectSeparadores(todosProdutos);
                renderizarTabela(todosProdutos);
            } catch (erro) {
                console.error('Erro ao carregar validades:', erro);
                document.getElementById('tabelaCorpo').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; color: #ef4444; padding: 20px;">
                            Erro ao carregar dados. Verifique a conexão com a API.
                        </td>
                    </tr>`;
            }
        }

        function popularSelectSeparadores(produtos) {
            const select = document.getElementById('selectSeparador');
            if (!select) return;

            const separadoresUnicos = [...new Set(
                produtos
                    .map(p => p.separador)
                    .filter(s => s && s !== '-' && s.trim() !== '' && s.toUpperCase() !== 'NULL')
            )].sort();

            select.innerHTML = '<option value="">-- Todos os Separadores --</option>';

            separadoresUnicos.forEach(sep => {
                const option = document.createElement('option');
                option.value = sep;
                option.textContent = sep;
                select.appendChild(option);
            });
        }

        function renderizarTabela(produtos) {
            const tbody = document.getElementById('tabelaCorpo');
            if (!tbody) return;

            if (produtos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px; color: #64748b;">
                            Nenhum registro encontrado.
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = '';

            produtos.forEach((item, index) => {
                const tr = document.createElement('tr');
                const estoqueClasse = item.estoque > 0 ? 'badge-estoque badge-destaque' : 'badge-estoque';

                tr.innerHTML = `
                    <td>${item.codigo || '-'}</td>
                    <td>${item.ean || '-'}</td>
                    <td>${item.complemento || '-'}</td>
                    <td><strong>${item.descricao || '-'}</strong></td>
                    <td>${item.separador || '-'}</td>
                    <td><span class="${estoqueClasse}">${Number(item.estoque || 0).toLocaleString('pt-BR')}</span></td>
                    <td>
                        <div class="lotes-container" id="lotes-prod-${index}">
                            <div class="lote-row">
                                <input type="number" placeholder="Qtd" class="input-qtd" min="1">
                                <input type="date" class="input-val">
                                <button class="btn-add" onclick="adicionarLote('lotes-prod-${index}')">+</button>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function adicionarLote(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const div = document.createElement('div');
            div.className = 'lote-row';
            div.innerHTML = `
                <input type="number" placeholder="Qtd" class="input-qtd" min="1">
                <input type="date" class="input-val">
                <button class="btn-remove" onclick="this.parentElement.remove()">-</button>
            `;
            container.appendChild(div);
        }

        function filtrarTabela() {
            const termoBusca = document.getElementById('searchInput').value.toLowerCase().trim();
            const separadorSelecionado = document.getElementById('selectSeparador').value;

            const produtosFiltrados = todosProdutos.filter(item => {
                const combinaBusca = !termoBusca || 
                    (item.codigo && item.codigo.toString().toLowerCase().includes(termoBusca)) ||
                    (item.ean && item.ean.toString().toLowerCase().includes(termoBusca)) ||
                    (item.complemento && item.complemento.toString().toLowerCase().includes(termoBusca)) ||
                    (item.descricao && item.descricao.toLowerCase().includes(termoBusca));

                const combinaSeparador = !separadorSelecionado || item.separador === separadorSelecionado;

                return combinaBusca && combinaSeparador;
            });

            renderizarTabela(produtosFiltrados);
        }

        function exportarExcel() {
            const linhas = document.querySelectorAll('#tabelaCorpo tr');
            
            let dadosParaExportar = [];
            let maxLotes = 0; // Vai descobrir quantas colunas de Qtd e Data precisa criar

            linhas.forEach(linha => {
                if (linha.querySelector('td[colspan]')) return;
                
                const colunas = linha.querySelectorAll('td');
                if (colunas.length < 7) return;

                const codigo = colunas[0].innerText.trim();
                const ean = colunas[1].innerText.trim();
                const complemento = colunas[2].innerText.trim();
                const descricao = colunas[3].innerText.trim().replace(/"/g, '""');
                const separador = colunas[4].innerText.trim();
                const estoque = colunas[5].innerText.trim(); // Será chamado de Disponível
                
                let lotesDestaLinha = [];
                const inputsQtd = linha.querySelectorAll('.input-qtd');
                const inputsVal = linha.querySelectorAll('.input-val');
                
                for (let i = 0; i < inputsQtd.length; i++) {
                    const qtd = inputsQtd[i].value.trim();
                    let data = inputsVal[i].value;
                    
                    if (data) {
                        const partes = data.split('-');
                        if (partes.length === 3) {
                            data = `${partes[2]}/${partes[1]}/${partes[0]}`;
                        }
                    }
                    
                    // Só adiciona se tiver digitado quantidade ou data
                    if (qtd || data) {
                        lotesDestaLinha.push({ qtd: qtd || '', data: data || '' });
                    }
                }
                
                // Se a linha teve alguma validade preenchida, salva para exportar
                if (lotesDestaLinha.length > 0) {
                    if (lotesDestaLinha.length > maxLotes) {
                        maxLotes = lotesDestaLinha.length;
                    }
                    dadosParaExportar.push({
                        codigo, ean, complemento, descricao, separador, estoque, lotes: lotesDestaLinha
                    });
                }
            });

            if (dadosParaExportar.length === 0) {
                alert("Nenhum produto com validade preenchida para exportar.");
                return;
            }

            // Monta o cabeçalho dinamicamente
            let cabecalho = ['Código', 'EAN', 'Complemento', 'Descrição', 'Separador', 'Disponível'];
            for (let i = 1; i <= maxLotes; i++) {
                cabecalho.push(`Qtd_${i}`);
                cabecalho.push(`Data_${i}`);
            }
            
            let csv = cabecalho.join(';') + '\n';

            // Monta as linhas
            dadosParaExportar.forEach(item => {
                let linhaCSV = [
                    `"${item.codigo}"`, 
                    `"${item.ean}"`, 
                    `"${item.complemento}"`, 
                    `"${item.descricao}"`, 
                    `"${item.separador}"`, 
                    `"${item.estoque}"`
                ];
                
                for (let i = 0; i < maxLotes; i++) {
                    if (i < item.lotes.length) {
                        linhaCSV.push(`"${item.lotes[i].qtd}"`);
                        linhaCSV.push(`"${item.lotes[i].data}"`);
                    } else {
                        // Se esse produto teve menos lotes que o máximo, preenche vazio
                        linhaCSV.push('""'); 
                        linhaCSV.push('""'); 
                    }
                }
                csv += linhaCSV.join(';') + '\n';
            });

            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'coleta_validades.csv';
            link.click();
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
